# HP2P - coturn (TURN/STUN) com credenciais temporárias (TURN REST API)
#
# O servidor de sinalização (server/peer-server) gera usuário/senha temporários em GET /hp2p/ice
# usando o MESMO segredo definido em static-auth-secret abaixo (config.json -> turn.secret).
#
# Linux:  turnserver -c /etc/coturn/turnserver.conf
# Docker: docker run -d --network=host -v $PWD/turnserver.conf:/etc/coturn/turnserver.conf coturn/coturn

listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=TROQUE-POR-UM-SEGREDO-LONGO-E-ALEATORIO
realm=hp2p
# external-ip=IP_PUBLICO            # obrigatório se o servidor estiver atrás de NAT (ex.: nuvem)
min-port=49160
max-port=49999
total-quota=200
user-quota=12
max-bps=8000000
no-cli
no-multicast-peers
no-tcp-relay
# Impede usar o TURN para alcançar a rede interna do servidor
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
# TLS (turns:) - recomendado para redes corporativas que só liberam 443/TCP
# cert=/etc/letsencrypt/live/SEU_DOMINIO/fullchain.pem
# pkey=/etc/letsencrypt/live/SEU_DOMINIO/privkey.pem
